[workspace]
resolver = "3"
members = ["copypatch", "taxon", "weavy", "fable"]
default-members = ["copypatch", "taxon", "weavy"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bearcove/weavy"
homepage = "https://github.com/bearcove/weavy"

[workspace.dependencies]
blake3 = { version = "1", default-features = false }
copypatch = { path = "copypatch", version = "0.2.0-rc.4" }
facet = { git = "https://github.com/facet-rs/facet", rev = "bbce10cbd1ddd535b0d812ccbf9456f7ff7d58cf" }
facet-core = { git = "https://github.com/facet-rs/facet", rev = "bbce10cbd1ddd535b0d812ccbf9456f7ff7d58cf" }
object = "0.39"
snark = { git = "https://github.com/bearcove/snark", rev = "0000000000000000000000000000000000000000" }
snark-dsl = { git = "https://github.com/bearcove/snark", rev = "0000000000000000000000000000000000000000" }
weavy = { path = "weavy", version = "0.2.2" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(facet_no_doc)", "cfg(kani)"] }

[workspace.lints.clippy]
disallowed_methods = "deny"

[profile.dev.package.weavy]
opt-level = 2

[profile.dev.package.blake3]
opt-level = 3
