[workspace]
resolver = "3"
members = ["copypatch", "taxon", "weavy", "weavy-phon"]
exclude = ["fable"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bearcove/weavy"
homepage = "https://github.com/bearcove/weavy"

[workspace.dependencies]
blake3 = { version = "1", default-features = false }
copypatch = { path = "copypatch", version = "0.2.0-rc.4" }
facet = { git = "https://github.com/facet-rs/facet", rev = "43e100aa2287cf7f054219add5612c40e551d48e" }
facet-core = { git = "https://github.com/facet-rs/facet", rev = "43e100aa2287cf7f054219add5612c40e551d48e" }
object = "0.39"
phon-schema = { git = "https://github.com/bearcove/phon", rev = "c25a3776a093323193236bc00bed4c5ae1a0af93" }
weavy = { path = "weavy", version = "0.2.2" }

[patch."https://github.com/bearcove/weavy"]
copypatch = { path = "copypatch" }
taxon = { path = "taxon" }
weavy = { path = "weavy" }

[patch.crates-io]
copypatch = { path = "copypatch" }
taxon = { path = "taxon" }
weavy = { path = "weavy" }


[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(facet_no_doc)", "cfg(kani)"] }

[workspace.lints.clippy]
disallowed_methods = "deny"

[profile.dev.package.weavy]
opt-level = 2

[profile.dev.package.blake3]
opt-level = 3
