[workspace]
resolver = "3"
members = ["copypatch", "weavy"]
exclude = ["fable"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bearcove/weavy"
homepage = "https://github.com/bearcove/weavy"

[workspace.dependencies]
copypatch = { path = "copypatch", version = "0.2.0-rc.5" }
object = "0.39"
weavy = { path = "weavy", version = "0.2.3-rc.0" }

[patch."https://github.com/bearcove/weavy"]
copypatch = { path = "copypatch" }
weavy = { path = "weavy" }

[patch.crates-io]
copypatch = { path = "copypatch" }
weavy = { path = "weavy" }


[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(facet_no_doc)", "cfg(kani)"] }

[workspace.lints.clippy]
disallowed_methods = "deny"

[profile.dev.package.weavy]
opt-level = 2

